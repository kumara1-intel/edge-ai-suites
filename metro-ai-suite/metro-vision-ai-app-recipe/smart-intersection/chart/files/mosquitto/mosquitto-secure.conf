allow_anonymous true

listener 1883
keyfile /mosquitto/secrets/broker-key
certfile /mosquitto/secrets/broker-cert
tls_version tlsv1.3

listener 1884
cafile /mosquitto/secrets/root-cert
keyfile /mosquitto/secrets/broker-key
certfile /mosquitto/secrets/broker-cert
protocol websockets

# Plaintext WebSocket listener for OpenShell sandboxed agents. OpenShell's L7 proxy
# cannot inspect TLS-wrapped traffic, so this listener stays on the in-cluster
# ClusterIP network only (never exposed externally).
listener 1885
protocol websockets
